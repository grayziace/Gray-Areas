<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colouring Gray Areas | Project Shenzhen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- City Skyline Block System -->
    <div class="skyline-base">
        <div class="building" style="height: 40%;"></div>
        <div class="building neon-pulse" style="height: 70%;"></div>
        <div class="building" style="height: 50%;"></div>
        <div class="building neon-pulse" style="height: 90%;"></div>
        <div class="building" style="height: 60%;"></div>
        <div class="building neon-pulse" style="height: 80%;"></div>
        <div class="building" style="height: 55%;"></div>
    </div>

    <div id="app">
        <!-- Sidebar/HUD Area -->
        <aside class="hud-panel">
            <div class="avatar-placeholder">[AVATAR_READY]</div>
            <h1>PLAYER: GRAY</h1>
            <p>MISSION: PROJECT SHENZHEN</p>
            <nav>
                <button>SYNC LOGS</button>
                <button>EXPLORE ATLAS</button>
                <button>IDENTITY MODULES</button>
                <button>SKILL TREE</button>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="content-panel">
            <header>
                <h2>SYSTEM STATUS: ONLINE</h2>
                <div id="status-light"></div>
            </header>
            <section id="mission-brief">
                <p>Waiting for data input. Initialize mission log...</p>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
