<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COLOURING GRAY AREAS | PROJECT SHENZHEN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="crt-overlay"></div>
    <div class="glitch-layer"></div>

    <div class="app-container">
        <aside class="sidebar">
            <div class="avatar-module">
                <div class="avatar-glow"></div>
                <div class="avatar-img">[AVATAR_READY]</div>
            </div>
            
            <h1 class="player-tag">PLAYER: GRAY</h1>
            <div class="status-indicator">
                <span class="pulse-dot"></span> MISSION: SHENZHEN
            </div>

            <nav class="nav-menu">
                <button class="nav-btn" data-target="logs">SYNC LOGS</button>
                <button class="nav-btn" data-target="atlas">EXPLORE ATLAS</button>
                <button class="nav-btn" data-target="modules">IDENTITY MODULES</button>
                <button class="nav-btn" data-target="skills">SKILL TREE</button>
            </nav>
        </aside>

        <main class="content-viewport">
            <header class="viewport-header">
                <h2 id="view-title">SYSTEM_READY</h2>
            </header>
            <section id="viewport-content">
                <p class="boot-text">INITIALIZING_CONNECTIVITY_PROTOCOLS...</p>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
